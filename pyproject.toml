[project]
name = "agentcodingdos"
version = "0.1.0"
description = "Security research on Agent DoS attacks via prompt injection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.0.0",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "mcp[cli]>=1.26.0",
    "datasets>=4.8.4",
    "tomli>=2.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
